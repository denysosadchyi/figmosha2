name: Tests

# Runs the test suite on GitHub's own machines for every pull request and
# every push to master. Code from a pull request never runs on our computers.
on:
  pull_request:
  push:
    branches: [master]

# Read-only: a pull request from a fork gets no secrets and cannot write.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -q -r requirements.txt pytest
          npm install --no-save --no-audit --no-fund jsdom@27.0.0
      - name: Run tests
        run: python -m pytest -q
