<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: #fff;
    background: #e8a317;
    transition: background 150ms ease;
    overflow: hidden;
  }
  body.ok      { background: #0fa958; }
  body.err     { background: #d32f2f; }
  body.pending { background: #e8a317; }
  /* The bridge has newer plugin code on disk than this window is running. */
  body.outdated { background: #7b61ff; }
  body.multi.outdated #badge { color: #7b61ff; }

  #status { min-width: 0; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* With 2+ files connected the icon and "1/2" sit together in a white pill. */
  #fileicon { flex: none; width: 8px; height: 12px; display: block; }
  /* Name on the left, icon / pill pushed to the right edge. */
  #badge { display: flex; align-items: center; gap: 3px; flex: none; order: 2; margin-left: auto; }
  body.multi #badge {
    padding: 2px 2px 2px 5px; border-radius: 999px;
    background: #fff; color: #0fa958;
  }
  body.multi.err #badge { color: #d32f2f; }
  body.multi #icon { font-size: 13px; }
  #peers {
    display: none;
    font-size: 10px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  body.multi #peers { display: block; }
  #icon { display: flex; font-size: 16px; flex: none; }
  #icon svg { display: block; }
  body.pending #icon, body.busy #icon { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <span id="badge"><span id="peers"></span><span id="icon"></span></span>
  <svg id="fileicon" viewBox="0 0 16 24" aria-hidden="true"><path fill="currentColor" d="M4 .3h3.7v7.4H4A3.7 3.7 0 0 1 4 .3zM8.3.3H12a3.7 3.7 0 0 1 0 7.4H8.3zM4 8.3h3.7v7.4H4a3.7 3.7 0 0 1 0-7.4zM12 8.3a3.7 3.7 0 1 1 0 7.4 3.7 3.7 0 0 1 0-7.4zM4 16.3h3.7V20A3.7 3.7 0 1 1 4 16.3z"/></svg>
  <span id="status">Connecting…</span>

<script>
// Icons: Solar icon set by 480 Design — CC BY 4.0
// https://www.figma.com/community/file/1166831539721848736
const ICONS = {
  ok: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM16.0303 8.96967C16.3232 9.26256 16.3232 9.73744 16.0303 10.0303L11.0303 15.0303C10.7374 15.3232 10.2626 15.3232 9.96967 15.0303L7.96967 13.0303C7.67678 12.7374 7.67678 12.2626 7.96967 11.9697C8.26256 11.6768 8.73744 11.6768 9.03033 11.9697L10.5 13.4393L12.7348 11.2045L14.9697 8.96967C15.2626 8.67678 15.7374 8.67678 16.0303 8.96967Z" clip-rule="evenodd"/></svg>`,
  err: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12ZM12 6.25C12.4142 6.25 12.75 6.58579 12.75 7V13C12.75 13.4142 12.4142 13.75 12 13.75C11.5858 13.75 11.25 13.4142 11.25 13V7C11.25 6.58579 11.5858 6.25 12 6.25ZM12 17C12.5523 17 13 16.5523 13 16C13 15.4477 12.5523 15 12 15C11.4477 15 11 15.4477 11 16C11 16.5523 11.4477 17 12 17Z" clip-rule="evenodd"/></svg>`,
  pending: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22ZM15.9346 5.59158C16.217 5.70662 16.4017 5.98121 16.4017 6.28616V9.00067C16.4017 9.41489 16.0659 9.75067 15.6517 9.75067H13C12.6983 9.75067 12.4259 9.56984 12.3088 9.29174C12.1917 9.01364 12.2527 8.69245 12.4635 8.47659L13.225 7.69705C11.7795 7.25143 10.1467 7.61303 9.00097 8.78596C7.33301 10.4935 7.33301 13.269 9.00097 14.9765C10.6593 16.6742 13.3407 16.6742 14.999 14.9765C15.6769 14.2826 16.0805 13.4112 16.2069 12.5045C16.2651 12.0865 16.5972 11.7349 17.0192 11.7349C17.4246 11.7349 17.7609 12.0595 17.7217 12.463C17.5957 13.7606 17.0471 15.0265 16.072 16.0247C13.8252 18.3248 10.1748 18.3248 7.92796 16.0247C5.69068 13.7344 5.69068 10.0281 7.92796 7.7378C9.66551 5.95905 12.244 5.55465 14.3647 6.53037L15.1152 5.76208C15.3283 5.54393 15.6522 5.47653 15.9346 5.59158Z" clip-rule="evenodd"/></svg>`,
};

const SERVER = "ws://localhost:8787/plugin";
const statusEl = document.getElementById("status");
const iconEl = document.getElementById("icon");
const peersEl = document.getElementById("peers");
let ws = null;
let reconnectTimer = null;
const recentLog = [];
let identity = { fileKey: null, name: null, docSig: null, pluginVersion: null };

function sendHello() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    ws.send(JSON.stringify({
      type: "hello", version: "2.1", plugin: identity.pluginVersion,
      fileKey: identity.fileKey, name: identity.name, docSig: identity.docSig,
    }));
  } catch (e) {}
}

// Kept for debugging via the plugin console — no longer rendered in the UI.
function log(line) {
  console.log("[figmosha] " + line);
}

// "1/2" — this window's slot among all plugin windows connected to the bridge.
// Shown only when connected and there are 2+ of them; a lone file keeps the icon.
let peers = null;
let state = "pending";
// Exec ids currently running in this file — while any are, the check spins.
const running = new Set();
let busyHold = null;

// Set when the bridge says plugin/code.js on disk is newer than this run.
let outdated = false;
let statusText = "Connecting…";

function render() {
  const multi = state === "ok" && peers && peers.total > 1;
  const busy = state === "ok" && (running.size > 0 || busyHold !== null);
  const failed = state === "ok" && !busy && errorHold !== null;
  const stale = state === "ok" && !busy && !failed && outdated;
  peersEl.textContent = multi ? `${peers.index}/${peers.total}` : "";
  statusEl.textContent = stale ? "New version: re-run plugin" : statusText;
  iconEl.innerHTML = ICONS[busy || stale ? "pending" : failed ? "err" : state] || "";
  document.body.className = (failed ? "err" : stale ? "ok outdated" : state)
    + (multi ? " multi" : "") + (busy ? " busy" : "");
}

// A failed exec turns the bar red for 2s, then it goes back to normal.
let errorHold = null;
function flashError() {
  clearTimeout(errorHold);
  errorHold = setTimeout(() => { errorHold = null; render(); }, 2000);
  render();
}

function execStarted(id) {
  running.add(id);
  render();
}

// Keep the spinner up for at least 400ms so a 20ms exec still registers.
function execFinished(id) {
  running.delete(id);
  clearTimeout(busyHold);
  busyHold = setTimeout(() => { busyHold = null; render(); }, 400);
  render();
}

function setPeers(p) {
  peers = p;
  render();
}

function setStatus(text, cls) {
  statusText = text;
  state = cls;
  if (cls !== "ok") { peers = null; running.clear(); }
  render();
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : "?";
}

function connect() {
  clearTimeout(reconnectTimer);
  setStatus("Connecting…", "pending");
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setStatus(identity.name || "connected", "ok");
    log("[ws] connected" + (identity.name ? ` as ${identity.name}` : ""));
    sendHello();
    // In case identity hasn't arrived from the plugin yet, ask for it.
    parent.postMessage({ pluginMessage: { type: "need-identity" } }, "*");
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      log(`[exec] ${shortId(msg.id)} code=${(msg.code || "").length}b`);
      execStarted(msg.id);
      parent.postMessage({ pluginMessage: { type: "exec", id: msg.id, code: msg.code } }, "*");
    } else if (msg.type === "ping") {
      // Liveness probe: the bridge sends this when another plugin instance
      // wants the slot. Answering keeps ours.
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    } else if (msg.type === "abort") {
      // The bridge gave up on this run; code.js marks it so h.ck() throws.
      parent.postMessage({ pluginMessage: { type: "abort", id: msg.id } }, "*");
    } else if (msg.type === "outdated") {
      outdated = true;
      log(`[outdated] running ${msg.running}, bridge has ${msg.expected}`);
      render();
    } else if (msg.type === "peers") {
      setPeers({ index: msg.index, total: msg.total });
    }
  };

  ws.onerror = () => {
    setStatus("Error", "err");
    log("[ws] error");
  };

  ws.onclose = () => {
    // The bridge holds one slot per open file, so a close is always transient:
    // bridge restart, or this tab's socket dropped. Just reconnect.
    setStatus("Reconnecting…", "pending");
    log("[ws] disconnected");
    reconnectTimer = setTimeout(connect, 2000);
  };
}

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "identity") {
    identity = { fileKey: m.fileKey || null, name: m.name || null, docSig: m.docSig || null,
                 pluginVersion: m.pluginVersion || null };
    log(`[id] file=${identity.name}`);
    // Show which file this window is bound to, once the socket is up.
    if (ws && ws.readyState === WebSocket.OPEN && identity.name) setStatus(identity.name, "ok");
    sendHello();  // (re-)register this connection under the file name
    return;
  }
  if (m.type === "result" || m.type === "error") {
    if (m.type === "error") flashError();
    execFinished(m.id);
  }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try { ws.send(JSON.stringify(m)); } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
};

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
    log("[ws] tab visible again — reconnecting now");
    connect();
  }
});

connect();
</script>
</body>
</html>
