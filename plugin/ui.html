<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    color: #fff;
    background: #e8a317;
    transition: background 150ms ease;
    overflow: hidden;
  }
  body.ok      { background: #0fa958; }
  body.err     { background: #d32f2f; }
  body.pending { background: #e8a317; }

  #icon { display: flex; font-size: 16px; flex: none; }
  #icon svg { display: block; }
  body.pending #icon { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <span id="icon"></span>
  <span id="status">Connecting…</span>

<script>
// Icons: Solar icon set by 480 Design — CC BY 4.0
// https://www.figma.com/community/file/1166831539721848736
const ICONS = {
  ok: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM16.0303 8.96967C16.3232 9.26256 16.3232 9.73744 16.0303 10.0303L11.0303 15.0303C10.7374 15.3232 10.2626 15.3232 9.96967 15.0303L7.96967 13.0303C7.67678 12.7374 7.67678 12.2626 7.96967 11.9697C8.26256 11.6768 8.73744 11.6768 9.03033 11.9697L10.5 13.4393L12.7348 11.2045L14.9697 8.96967C15.2626 8.67678 15.7374 8.67678 16.0303 8.96967Z" clip-rule="evenodd"/></svg>`,
  err: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12ZM12 6.25C12.4142 6.25 12.75 6.58579 12.75 7V13C12.75 13.4142 12.4142 13.75 12 13.75C11.5858 13.75 11.25 13.4142 11.25 13V7C11.25 6.58579 11.5858 6.25 12 6.25ZM12 17C12.5523 17 13 16.5523 13 16C13 15.4477 12.5523 15 12 15C11.4477 15 11 15.4477 11 16C11 16.5523 11.4477 17 12 17Z" clip-rule="evenodd"/></svg>`,
  pending: `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22ZM15.9346 5.59158C16.217 5.70662 16.4017 5.98121 16.4017 6.28616V9.00067C16.4017 9.41489 16.0659 9.75067 15.6517 9.75067H13C12.6983 9.75067 12.4259 9.56984 12.3088 9.29174C12.1917 9.01364 12.2527 8.69245 12.4635 8.47659L13.225 7.69705C11.7795 7.25143 10.1467 7.61303 9.00097 8.78596C7.33301 10.4935 7.33301 13.269 9.00097 14.9765C10.6593 16.6742 13.3407 16.6742 14.999 14.9765C15.6769 14.2826 16.0805 13.4112 16.2069 12.5045C16.2651 12.0865 16.5972 11.7349 17.0192 11.7349C17.4246 11.7349 17.7609 12.0595 17.7217 12.463C17.5957 13.7606 17.0471 15.0265 16.072 16.0247C13.8252 18.3248 10.1748 18.3248 7.92796 16.0247C5.69068 13.7344 5.69068 10.0281 7.92796 7.7378C9.66551 5.95905 12.244 5.55465 14.3647 6.53037L15.1152 5.76208C15.3283 5.54393 15.6522 5.47653 15.9346 5.59158Z" clip-rule="evenodd"/></svg>`,
};

const SERVER = "ws://localhost:8787/plugin";
const statusEl = document.getElementById("status");
const iconEl = document.getElementById("icon");
let ws = null;
let reconnectTimer = null;

// Kept for debugging via the plugin console — no longer rendered in the UI.
function log(line) {
  console.log("[figmosha] " + line);
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  iconEl.innerHTML = ICONS[cls] || "";
  document.body.className = cls;
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : "?";
}

function connect() {
  clearTimeout(reconnectTimer);
  setStatus("Connecting…", "pending");
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setStatus("Connected", "ok");
    log("[ws] connected");
    try { ws.send(JSON.stringify({ type: "hello", version: "2.0" })); } catch (e) {}
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      log(`[exec] ${shortId(msg.id)} code=${(msg.code || "").length}b`);
      parent.postMessage({ pluginMessage: { type: "exec", id: msg.id, code: msg.code } }, "*");
    } else if (msg.type === "ping") {
      // Liveness probe: the bridge sends this when another plugin instance
      // wants the slot. Answering keeps ours.
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    }
  };

  ws.onerror = () => {
    setStatus("Error", "err");
    log("[ws] error");
  };

  ws.onclose = (e) => {
    if (e && e.code === 1008) {
      // The bridge already has a live plugin — most likely this file is open in
      // another Figma window. Retrying every 2s would just spam both sides.
      setStatus("Slot busy", "err");
      log("[ws] rejected: another plugin instance holds the bridge");
      reconnectTimer = setTimeout(connect, 15000);
      return;
    }
    setStatus("Reconnecting…", "pending");
    log("[ws] disconnected");
    reconnectTimer = setTimeout(connect, 2000);
  };
}

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try { ws.send(JSON.stringify(m)); } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
};

connect();
</script>
</body>
</html>
