<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--sunken);
    color: var(--text);
  }
  /* The header stays neutral in every state: only the status icon has color. */
  #bar {
    flex: none;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px 0 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: var(--text);
    background: var(--surface);
    overflow: hidden;
  }
  body.chatmode #bar { box-shadow: inset 0 -1px var(--line); }
  /* A newer Figmosha release is out: "New version 2.4.0" + Update. */
  #update {
    display: none; flex: none;
    padding: 2px 8px; border: 0; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font: inherit; font-size: 10px; font-weight: 700; line-height: 1.2;
    cursor: pointer;
  }
  #update:hover { background: var(--accent-soft-hover); }
  body.update #update { display: block; }

  #status { min-width: 0; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fileicon { flex: none; width: 8px; height: 12px; display: block; color: var(--faint); }
  /* Status icon (and "1/2" with 2+ files) pushed to the right, before the buttons. */
  #badge { display: flex; align-items: center; gap: 3px; flex: none; margin-left: auto; }
  body.multi #badge { padding: 2px 2px 2px 5px; border-radius: 999px; background: var(--well); color: var(--muted); }
  body.multi #icon { font-size: 13px; }
  #peers {
    display: none;
    font-size: 10px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  body.multi #peers { display: block; }
  #icon { display: flex; font-size: 16px; flex: none; }
  #icon svg { display: block; }
  #icon.st-ok     { color: var(--ok); }
  #icon.st-busy   { color: var(--warn); }
  #icon.st-err    { color: var(--err); }
  #icon.st-update { color: var(--info); }
  #icon.st-conn   { color: var(--faint); }
  #icon.st-busy, #icon.st-conn { animation: spin 1.1s linear infinite; }
  /* Buttons on the right edge of the header, in one row. */
  #barActions { display: flex; align-items: center; gap: 2px; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ── chat: the board chat design, inside the plugin window ── */
  :root { --r-window:12px; --r-lg:10px; --r-md:8px; --r-sm:6px;
    --surface:#fff; --raised:#fff; --sunken:#f4f4f6; --hover:#f4f4f6; --line:#e8e8ec; --line2:#dcdce1;
          --text:#1b1b1f; --muted:#6b6f76; --faint:#8a8d95; --bubble:#fff; --bubble-me:#fff;
          --accent:#2f6af5; --accent-soft:#ebf0fe; --accent-soft-hover:#dce5fd; --accent-fill:#2f6af5; --on-accent:#fff;
          --ok:#2f9e6b; --ok-soft:#e9f6ef; --warn:#d18a00; --info:#0d8ce0; --err:#d64545; --err-soft:#fcecec; --err-line:#f1caca;
          --bubble-shadow:0 1px 1px rgba(0,0,0,.04), 0 1px 4px rgba(0,0,0,.04);
          --compose-shadow:0 4px 12px rgba(0,0,0,.03), 0 16px 56px rgba(0,0,0,.06);
          --pop-shadow:0 4px 12px rgba(0,0,0,.06), 0 16px 56px rgba(0,0,0,.1);
          --scrim:rgba(0,0,0,.6); --on-scrim:#fff; --glow-a:#2f6af5; --glow-b:#14c28a;
          --well:#f4f4f6; --well-me:#f4f4f6;
          --toast-bg:#1b1b1f; --toast-fg:#fff; --toast-ring:none;
          --primary-focus:0 2px 6px rgba(47,106,245,.35); }
  /* Dark set: on when the theme is Dark, or System in a dark Figma (the settings script sets the class). */
  /* Figma UI3 dark: neutral greys, Figma blue. Borders, not shadows. Plain hex, not --figma-color-*,
     because Dark can be picked while Figma itself is light. */
  :root.dark { --surface:#2c2c2c; --raised:#2c2c2c; --sunken:#1e1e1e; --hover:#383838; --line:#444444; --line2:#545454;
          --text:#ffffff; --muted:#b3b3b3; --faint:#999999; --bubble:#2c2c2c; --bubble-me:#383838;
          --accent:#0d99ff; --accent-soft:#1f3a52; --accent-soft-hover:#26496a; --accent-fill:#0a6dc2; --on-accent:#ffffff;
          --ok:#79d297; --ok-soft:#1d3327; --warn:#f7d15f; --info:#7cc4f8; --err:#fca397; --err-soft:#3d2622; --err-line:#6b3a31;
          --bubble-shadow:none;
          --compose-shadow:0 0 0 1px #444444; --pop-shadow:0 2px 8px rgba(0,0,0,.35);
          --scrim:rgba(0,0,0,.6); --on-scrim:#ffffff; --glow-a:#0d99ff; --glow-b:#14ae5c;
          --well:#383838; --well-me:#444444;
          --toast-bg:#383838; --toast-fg:#ffffff; --toast-ring:0 0 0 1px #545454, 0 2px 8px rgba(0,0,0,.35);
          --primary-focus:0 2px 8px rgba(13,153,255,.4); color-scheme:dark; }
  /* Interface scale from the settings page. code.js resizes the window by the same factor. */
  html { zoom:var(--ui-scale, 1); }

  /* chat icon in the bar: opens the chat, and closes it back to the bar */
  #chatbtn { flex:none; position:relative; width:22px; height:22px; padding:0; border:0; border-radius:50%;
             display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--muted); cursor:pointer; }
  #chatbtn svg { width:16px; height:16px; }
  #chatbtn:hover { background:var(--hover); color:var(--text); }
  #chatbtn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  body.chatmode #chatbtn { background:var(--accent-soft); color:var(--accent); }
  #chatbtn i { position:absolute; top:1px; right:1px; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 1.5px var(--surface); display:none; }
  body.unread #chatbtn i { display:block; }
  body.cbusy:not(.chatmode) #chatbtn i { display:block; animation:cpulse 1.2s ease-in-out infinite; }
  @keyframes cpulse { 50% { opacity:.3; } }
  /* settings icon next to the chat icon, only in chat mode */
  #setbtn { display:none; flex:none; width:22px; height:22px; padding:0; border:0; border-radius:50%;
            align-items:center; justify-content:center; background:transparent; color:var(--muted); cursor:pointer; }
  body.chatmode #setbtn { display:inline-flex; }
  #setbtn svg { width:16px; height:16px; }
  #setbtn:hover { background:var(--hover); color:var(--text); }
  #setbtn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  html.settings-open #setbtn { background:var(--accent-soft); color:var(--accent); }
  html.settings-open body.chatmode #chatbtn { background:transparent; color:var(--muted); }

  /* settings page: replaces the chat while open */
  #settings { display:none; flex:1; min-height:0; flex-direction:column; padding:8px 12px 16px; overflow-y:auto; font-size:13px; color:var(--text); background:var(--surface); }
  html.settings-open body.chatmode #settings { display:flex; }
  html.settings-open #chat { display:none !important; }
  .shead { display:flex; align-items:center; gap:4px; margin-bottom:8px; }
  .shead h2 { margin:0; font-size:14px; font-weight:600; }
  #sBack { flex:none; width:32px; height:32px; padding:0; border:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--muted); cursor:pointer; }
  #sBack:hover { color:var(--text); background:var(--hover); }
  #sBack svg { width:18px; height:18px; }
  #sBack:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* One row per setting: the label left, a dropdown right. No cards: a plain list on the page,
     split by a 1px line. The line is the top border of every shown row after the first shown one,
     so a hidden row never doubles it. */
  .srow { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:40px; padding:4px 0; }
  .srow[hidden] { display:none; }
  .srow:not([hidden]) ~ .srow:not([hidden]) { border-top-width:1px; border-top-style:solid; border-top-color:var(--line); }
  .srow h3 { flex:1 1 auto; min-width:0; margin:0; font-size:13px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Dropdowns: native select, a CSS chevron on the wrapper, at most 60% of the row. */
  .dd { position:relative; display:block; flex:0 1 auto; min-width:0; max-width:60%; }
  .dd::after { content:""; position:absolute; right:12px; top:50%; width:6px; height:6px; margin-top:-5px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:rotate(45deg); pointer-events:none; }
  .dd select { -webkit-appearance:none; appearance:none; display:block; width:auto; max-width:100%; height:30px; margin:0; padding:0 30px 0 10px; border:0; border-radius:var(--r-md); background:var(--sunken); color:var(--text); font:inherit; font-size:12px; font-weight:500; cursor:pointer; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .dd select:hover { background:var(--hover); }
  .dd select:focus { outline:none; }
  .dd select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .dd select option { background:var(--surface); color:var(--text); }
  .dd select option:disabled { color:var(--faint); }
  /* no agent on the bridge computer: this card stands where the composer would be */
  #cNoAgent { display:none; position:relative; z-index:2; margin:0 8px 8px; flex-direction:column; gap:8px; padding:12px; border-radius:var(--r-lg); background:var(--raised); box-shadow:var(--compose-shadow); font-size:12px; line-height:1.4; color:var(--text); }
  #cNoAgent h3 { margin:0; font-size:13px; font-weight:600; }
  #cNoAgent p { margin:0; color:var(--muted); }
  #cNoAgent .nrow { display:flex; flex-direction:column; gap:4px; }
  #cNoAgent .nrow b { font-weight:600; }
  #cNoAgent code { display:block; font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:6px 8px; border-radius:var(--r-md); background:var(--well); overflow-wrap:anywhere; user-select:all; }
  #cNoAgent .nbtn { align-self:flex-start; }

  #chat { display:none; flex:1; min-height:0; position:relative; flex-direction:column; font-size:13px; font-weight:400; color:var(--text); background:var(--sunken); }
  body.chatmode #chat { display:flex; }
  .msgs { flex:1; overflow-y:auto; padding:12px 12px 16px; display:flex; flex-direction:column; gap:4px; overscroll-behavior:contain; }
  .hint { margin:auto 16px; text-align:center; color:var(--muted); font-size:13px; line-height:1.5; }
  .mrow { display:flex; flex-direction:column; gap:4px; max-width:85%; }
  .mrow.me { align-self:flex-end; align-items:flex-end; }
  .mrow.claude, .mrow.system { align-self:flex-start; align-items:flex-start; }
  .mrow.me + .mrow.claude, .mrow.claude + .mrow.me, .mrow.system + .mrow.me, .mrow.me + .mrow.system { margin-top:12px; }
  .msg { max-width:100%; padding:8px 12px; border-radius:var(--r-lg); font-size:13px; line-height:1.45; overflow-wrap:anywhere; background:var(--bubble); box-shadow:var(--bubble-shadow); }
  .msg.me { background:var(--bubble-me); --well:var(--well-me); }
  .msg.system { background:var(--err-soft); color:var(--err); box-shadow:none; border:1px solid var(--err-line); border-radius:var(--r-md); }
  .msg.system.info { background:var(--surface); color:var(--muted); border-color:var(--line); }
  .msg a { color:inherit; text-decoration:underline; text-underline-offset:2px; }
  .msg code { font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:1px 4px; border-radius:4px; background:var(--well); }
  .msg pre { margin:6px 0; padding:8px 10px; border-radius:var(--r-sm); background:var(--well); font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  /* headings: compact, they fit the narrow bubble */
  .msg .mh { margin:8px 0 2px; font-size:13px; font-weight:700; line-height:1.35; }
  .msg .mh:first-child { margin-top:0; }
  .msg .mh[aria-level="1"], .msg .mh[aria-level="2"] { font-size:14px; }
  /* tables scroll sideways inside the bubble */
  .msg .mtable { margin:6px 0; max-width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-sm); scrollbar-width:thin; }
  .msg .mtable table { border-collapse:collapse; font-size:12px; line-height:1.35; }
  .msg .mtable th, .msg .mtable td { padding:4px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); text-align:left; vertical-align:top; overflow-wrap:normal; }
  .msg .mtable th { white-space:nowrap; }
  .msg .mtable td { min-width:48px; max-width:240px; }
  .msg .mtable th:last-child, .msg .mtable td:last-child { border-right:0; }
  .msg .mtable tbody tr:last-child td { border-bottom:0; }
  .msg .mtable th { font-weight:600; background:var(--well); }
  .msg .mtable code { font-size:11px; }
  .msg.stream::after { content:""; display:inline-block; width:6px; height:13px; margin-left:2px; vertical-align:-2px; border-radius:1px; background:var(--accent); animation:cpulse 1s ease-in-out infinite; }
  .mfoot { display:flex; align-items:center; gap:2px; }
  .mrow.me .mfoot { flex-direction:row-reverse; }
  .meta { font-size:11px; color:var(--faint); white-space:nowrap; padding:0 4px; font-variant-numeric:tabular-nums; }
  .qbtn { flex:none; width:24px; height:24px; padding:0; border:0; border-radius:50%; background:transparent; color:var(--faint); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; }
  .qbtn svg { width:15px; height:15px; }
  .mrow:hover .qbtn, .qbtn:focus-visible { opacity:.8; }
  .qbtn:hover { color:var(--accent); opacity:1; background:var(--surface); }
  .mq { display:block; width:100%; margin:0 0 6px; padding:6px 10px; border:0; border-radius:var(--r-sm); background:var(--sunken); color:var(--muted); font:inherit; font-size:12px; line-height:1.4; text-align:left; cursor:pointer; }
  .mq b { display:block; color:var(--accent); font-weight:600; }
  .mq span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mrow.flash .msg { box-shadow:0 0 0 2px var(--accent); transition:box-shadow .2s; }
  .mimg { display:block; max-width:220px; max-height:280px; border-radius:var(--r-md); background:var(--surface); }
  /* actions: A/B/C buttons in a column, only under the last reply */
  .mrow:has(.acts) { width:85%; } .msg:has(.acts) { width:100%; }
  .acts { display:grid; grid-template-columns:1fr; gap:8px; margin:12px 0 4px; }
  .act { font:inherit; font-size:13px; line-height:1.3; text-align:left; display:flex; align-items:center; gap:10px; padding:8px 12px 8px 8px; border:1px solid var(--line2); border-radius:var(--r-md); cursor:pointer; background:var(--surface); color:var(--text); }
  .act .ak { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--well); color:var(--muted); font-size:12px; font-weight:600; }
  .act:hover { background:var(--accent-soft); border-color:var(--accent-soft); }
  .act:hover .ak { background:var(--accent-fill); color:var(--on-accent); }
  .act:disabled { opacity:.5; cursor:default; }
  .act:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* questions: each question has its own answer field */
  .mrow:has(.qs) { width:92%; max-width:92%; } .msg:has(.qs) { width:100%; }
  .qs { display:flex; flex-direction:column; gap:8px; margin:12px 0 4px; }
  .qs-head { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
  .qs-head i { position:relative; flex:1; height:4px; border-radius:2px; overflow:hidden; background:var(--line2); }
  .qs-head i::after { content:""; position:absolute; inset:0 auto 0 0; width:calc(var(--p) * 100%); border-radius:2px; background:var(--ok); transition:width .3s; }
  .qa { padding:10px; border:1px solid var(--line2); border-radius:var(--r-lg); background:var(--surface); }
  .qa.done { border-color:transparent; background:var(--sunken); }
  .qq { display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:1.45; }
  .qq > span:last-child { flex:1; min-width:0; padding-top:2px; overflow-wrap:anywhere; }
  .qn { flex:none; display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600; }
  .qn svg { width:14px; height:14px; }
  .qa.done .qn { background:var(--ok-soft); color:var(--ok); }
  .qans { margin:6px 0 0 34px; font-size:13px; line-height:1.45; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; }
  .qf { display:flex; align-items:flex-end; gap:6px; margin:10px 0 0; padding:4px 4px 4px 12px; border-radius:var(--r-md); background:var(--sunken); }
  .qf:focus-within { box-shadow:0 0 0 2px var(--accent); }
  .qf textarea { flex:1; min-width:0; max-height:140px; padding:6px 0; border:0; background:none; color:var(--text); font:inherit; font-size:13px; line-height:1.45; resize:none; outline:none; }
  .qf.sending { opacity:.6; }
  .qsend, .send { flex:none; display:grid; place-items:center; padding:0; border:0; border-radius:50%; background:var(--accent-soft); color:var(--accent); cursor:pointer; }
  .qsend { width:30px; height:30px; } .qsend svg { width:14px; height:14px; }
  .qsend:hover, .send:hover { background:var(--accent-soft-hover); }
  .qsend:focus-visible, .send:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* compose: floating card at the bottom, with the working line on top while busy */
  .compose { position:relative; z-index:2; margin:0 8px 8px; display:flex; flex-wrap:wrap; gap:7px 8px; padding:7px; border-radius:var(--r-lg); background:var(--raised); box-shadow:var(--compose-shadow); align-items:flex-end; }
  .typing { order:-1; width:calc(100% + 14px); display:flex; align-items:center; gap:8px; height:40px; margin:-7px -7px 0; padding:0 8px 0 14px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
  .typing[hidden] { display:none; }
  .typing span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .typing small { color:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stop { flex:none; width:28px; height:28px; padding:0; border:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); background:transparent; cursor:pointer; }
  .stop:hover { color:var(--text); background:var(--hover); }
  .stop svg { width:18px; height:18px; }
  .stop:disabled { opacity:.45; cursor:default; }
  .qbar { width:100%; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 12px; border-radius:var(--r-sm); background:var(--sunken); font-size:12px; line-height:1.4; color:var(--muted); }
  .qbar[hidden], .att[hidden] { display:none; }
  .qbar div { flex:1; min-width:0; }
  .qbar b { display:block; color:var(--accent); font-weight:600; }
  .qbar span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qbar button, .clip { flex:none; width:32px; height:32px; padding:0; border:0; border-radius:50%; background:transparent; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .qbar button svg { width:16px; height:16px; } .clip svg { width:18px; height:18px; }
  .clip:hover { color:var(--accent); }
  .att { width:100%; display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; }
  .att .th { position:relative; flex:none; width:56px; height:56px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--line); }
  .att .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .att .th button { position:absolute; top:2px; right:2px; width:20px; height:20px; padding:0; border:0; border-radius:50%; background:var(--scrim); color:var(--on-scrim); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .att .th button svg { width:13px; height:13px; }
  .field { flex:1; min-width:0; display:flex; align-items:flex-end; gap:2px; }
  .field textarea { flex:1; min-width:0; resize:none; font:inherit; font-size:13px; line-height:20px; padding:6px 4px; border:0; background:transparent; color:var(--text); max-height:140px; min-height:32px; outline:none; }
  .field textarea::placeholder { color:var(--faint); }
  .send { width:32px; height:32px; } .send svg { width:15px; height:15px; }
  .send:disabled { opacity:.45; cursor:default; }
  .glow { position:absolute; z-index:1; left:6%; right:6%; bottom:44px; height:8px; filter:blur(7px); pointer-events:none; opacity:0; transition:opacity .3s; }
  .glow::before, .glow::after { content:""; position:absolute; top:0; bottom:0; border-radius:50%; }
  .glow::before { left:0; right:0; opacity:.35; background:linear-gradient(90deg, var(--glow-a), var(--glow-b), var(--glow-a), var(--glow-b), var(--glow-a)) 0 0 / 400% 100%; }
  .glow::after { left:0; width:60%; opacity:.4; background:linear-gradient(90deg, var(--glow-a), var(--glow-b)); }
  .glow.on { opacity:1; }
  .glow.on::after { animation:beam 1.1s cubic-bezier(.45,0,.55,1) infinite alternate; }
  @keyframes beam { 0% { transform:translateX(0) scaleY(.7); } 50% { transform:translateX(33.33%) scaleY(1.5); } 100% { transform:translateX(66.67%) scaleY(.7); } }

<script id="chat-core">
// Pure chat logic: no DOM, no network. tests/chat_ui.test.js runs it in node.
var ChatCore = (function () {
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  // plain text: escape, links, **bold**, new lines
  function inline(s) {
    return esc(s)
      .replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]]/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"; })
      .replace(/\*\*([^*\n]+?)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>");
  }
  // text outside code blocks: `code` spans keep their text as it is
  function spans(s) {
    return s.split(/`([^`\n]+)`/).map(function (p, i) { return i % 2 ? "<code>" + esc(p) + "</code>" : inline(p); }).join("");
  }
  // Blocks in text outside code blocks: # headings and GFM pipe tables. Other lines stay text.
  // A block takes the line breaks and blank lines next to it: it has its own margins.
  var HEAD = /^\s{0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
  var SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  function cells(line) {
    var t = line.trim().replace(/^\|/, "").replace(/(^|[^\\])\|$/, "$1");
    return t.split(/(?<!\\)\|/).map(function (c) { return c.replace(/\\\|/g, "|").trim(); });
  }
  function table(head, sep, rows) {
    var al = sep.map(function (c) { return /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : /^:/.test(c) ? "left" : ""; });
    var row = function (cs, tag) {
      return "<tr>" + al.map(function (a, i) {
        return "<" + tag + (a ? ' style="text-align:' + a + '"' : "") + ">" + spans(cs[i] || "") + "</" + tag + ">";
      }).join("") + "</tr>";
    };
    return '<div class="mtable"><table><thead>' + row(head, "th") + "</thead>"
      + (rows.length ? "<tbody>" + rows.map(function (r) { return row(r, "td"); }).join("") + "</tbody>" : "") + "</table></div>";
  }
  function blocks(s) {
    var lines = s.split("\n"), out = "", buf = [], i = 0, m, sep;
    var flush = function () {
      while (buf.length && !buf[buf.length - 1].trim()) buf.pop();
      if (buf.length) out += spans(buf.join("\n"));
      buf = [];
    };
    var block = function (html) {
      flush(); out += html;
      while (i < lines.length && !lines[i].trim()) i++;
    };
    while (i < lines.length) {
      var l = lines[i];
      if ((m = HEAD.exec(l))) {
        i++; block('<div class="mh" role="heading" aria-level="' + m[1].length + '">' + spans(m[2]) + "</div>");
      } else if (l.indexOf("|") >= 0 && i + 1 < lines.length && lines[i + 1].indexOf("-") >= 0 && SEP.test(lines[i + 1])
                 && (sep = cells(lines[i + 1])).length === cells(l).length) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && lines[i].indexOf("|") >= 0 && lines[i].trim()) rows.push(cells(lines[i++]));
        block(table(head, sep, rows));
      } else { buf.push(l); i++; }
    }
    // the text at the end keeps its last line break: it may touch a code block
    if (buf.length) out += spans(buf.join("\n"));
    return out;
  }
  function renderText(s) {
    return String(s == null ? "" : s).split(/```[^\n`]*\n([\s\S]*?)```/)
      .map(function (p, i) { return i % 2 ? "<pre>" + esc(p.replace(/\n$/, "")) + "</pre>" : blocks(p); }).join("");
  }
  function actionLetter(i) { return "ABCDEFGH".charAt(i); }
  // Slash commands. Known ones get a Ukrainian hint and come first, in this order.
  var HINTS = {
    clear: "Почати нову розмову", compact: "Стиснути розмову до підсумку", context: "Показати, скільки контексту зайнято",
    usage: "Показати ліміти і витрати", model: "Змінити модель", effort: "Змінити рівень зусиль", fast: "Увімкнути швидкий режим",
    init: "Створити CLAUDE.md для проєкту", rename: "Перейменувати розмову", recap: "Короткий підсумок сесії",
    "code-review": "Перевірити зміни в коді", "security-review": "Перевірити безпеку змін", simplify: "Спростити змінений код",
    mcp: "Керувати MCP серверами", config: "Змінити налаштування", "output-style": "Вибрати стиль відповідей",
    advisor: "Радитися з сильнішою моделлю", debug: "Знайти причину збою", doctor: "Перевірити налаштування Claude Code",
    loop: "Повторювати завдання", schedule: "Запланувати завдання", goal: "Працювати, поки мету не досягнуто",
    insights: "Звіт про твої сесії", autocompact: "Коли стискати розмову самому", "reload-skills": "Перечитати навички",
    "skill-doctor": "Знайти зайві навички"
  };
  var HINTS_EN = {
    clear: "Start a new conversation", compact: "Compact the conversation to a summary", context: "Show how much context is used",
    usage: "Show limits and costs", model: "Change the model", effort: "Change the effort level", fast: "Turn on fast mode",
    init: "Create CLAUDE.md for the project", rename: "Rename the conversation", recap: "Short summary of the session",
    "code-review": "Review the code changes", "security-review": "Check the changes for security", simplify: "Simplify the changed code",
    mcp: "Manage MCP servers", config: "Change the settings", "output-style": "Pick the reply style",
    advisor: "Ask a stronger model for advice", debug: "Find the cause of a failure", doctor: "Check the Claude Code setup",
    loop: "Repeat a task", schedule: "Schedule a task", goal: "Work until the goal is reached",
    insights: "Report about your sessions", autocompact: "When to compact by itself", "reload-skills": "Read the skills again",
    "skill-doctor": "Find extra skills"
  };
  var ORDER = Object.keys(HINTS);
  var FALLBACK_COMMANDS = ["clear", "compact", "context", "usage", "init", "rename", "recap", "code-review", "simplify"]
    .map(function (n) { return n === "clear" ? { name: n, aliases: ["reset", "new"] } : { name: n }; });
  function commandHint(c, lang) {
    var hints = lang === "en" ? HINTS_EN : HINTS;
    if (hints[c.name]) return hints[c.name];
    var d = String(c.description || "").trim(), m = /^.*?[.!?](?=\s|$)/.exec(d);
    return m ? m[0] : d;
  }
  // The list for the popup: only while the text is a slash and a name, with no space yet.
  function matchCommands(list, text) {
    var m = /^\/([^\s\/]*)$/.exec(String(text || ""));
    if (!m) return [];
    var q = m[1].toLowerCase();
    var keys = function (c) { return [c.name].concat(c.aliases || []).map(function (k) { return String(k).toLowerCase(); }); };
    var rank = function (a, b) {
      var i = ORDER.indexOf(a.name), j = ORDER.indexOf(b.name);
      i = i < 0 ? 1e6 : i; j = j < 0 ? 1e6 : j;
      return i - j || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    };
    var all = (list || []).filter(function (c) { return c && c.name && c.name.charAt(0) !== "_"; });
    var pre = all.filter(function (c) { return keys(c).some(function (k) { return k.indexOf(q) === 0; }); }).sort(rank);
    var sub = q.length < 2 ? [] : all.filter(function (c) {
      return pre.indexOf(c) < 0 && keys(c).some(function (k) { return k.indexOf(q) > 0; });
    }).sort(rank);
    return pre.concat(sub);
  }
  function initialState() { return { messages: [], busy: false, activity: [], stream: "", commands: [] }; }
  function copy(s, patch) { var o = {}, k; for (k in s) o[k] = s[k]; for (k in patch) o[k] = patch[k]; return o; }
  function reduce(s, e) {
    switch (e && e.kind) {
      case "history":
        return copy(s, { messages: (e.messages || []).slice(), busy: !!e.busy, activity: (e.activity || []).slice(-30), stream: "",
                         commands: e.commands ? e.commands.slice() : s.commands });
      case "commands":
        return copy(s, { commands: (e.commands || []).slice() });
      case "message": {
        var m = e.message; if (!m) return s;
        var at = -1;
        for (var i = 0; i < s.messages.length; i++) if (s.messages[i].id === m.id) at = i;
        var list = s.messages.slice();
        if (at >= 0) list[at] = m; else list.push(m);
        return copy(s, { messages: list, stream: m.from === "claude" ? "" : s.stream });
      }
      case "delta":
        return copy(s, { stream: s.stream + (e.text || "") });
      case "activity":
        return copy(s, { activity: s.activity.concat([{ text: String(e.text || ""), t: e.t != null ? e.t : Math.floor(Date.now() / 1000) }]).slice(-30) });
      case "busy":
        return e.busy ? copy(s, { busy: true }) : copy(s, { busy: false, activity: [], stream: "" });
      default:
        return s;
    }
  }
  return { esc: esc, renderText: renderText, actionLetter: actionLetter, initialState: initialState, reduce: reduce,
           matchCommands: matchCommands, commandHint: commandHint, FALLBACK_COMMANDS: FALLBACK_COMMANDS,
           HINTS: HINTS, HINTS_EN: HINTS_EN };
})();

function connect() {

    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    // A new bridge may have different code on disk; it re-sends `outdated` at
    // hello time if this build is still behind.
    outdated = false;
    update = null;
    renderChat();
    setStatus(identity.name || t("connected"), "ok");
    log("[ws] connected" + (identity.name ? ` as ${identity.name}` : ""));

  ws.onmessage = (e) => {

      execStarted(msg.id);

      parent.postMessage({ pluginMessage: {

    } else if (msg.type === "ping") {
      // Liveness probe: the bridge sends this when another plugin instance
      // wants the slot. Answering keeps ours.
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    } else if (msg.type === "abort") {
      // The bridge gave up on this run; code.js marks it so h.ck() throws.
      parent.postMessage({ pluginMessage: { type: "abort", id: msg.id } }, "*");
    } else if (msg.type === "update") {
      // A newer release (vX.Y.Z tag) than the bridge's VERSION; url = its release page.
      // latest null: the bridge withdrew the offer.
      update = msg.latest ? { latest: msg.latest, current: msg.current, url: msg.url } : null;
      render();
      renderChat();
    } else if (msg.type === "outdated") {
      outdated = true;
      outdatedTo = String(msg.expected || "");
      log(`[outdated] running ${msg.running}, bridge has ${msg.expected}`);
      render();
      renderChat();
    } else if (msg.type === "chat") {

  ws.onerror = () => {

  ws.onclose = () => {

    // bridge restart, or this tab's socket dropped. Just reconnect.
    setStatus(t("reconnecting"), "pending");
    log("[ws] disconnected");

    reconnectTimer = setTimeout(connect, 2000);
  };
}

    log(`[id] file=${identity.name}`);

  }

      .map(([v, icon, key]) => radio("theme", v, '<span class="oico">' + onIcon(icon) + '</span><span>' + C.esc(t(key)) + '</span>', ' class="ochoice"')).join("") + '</div></div>'
    + '<div class="ostep" role="group" aria-labelledby="onH4">' + head(4, "zoom", T.scaleTitle, T.scaleText)
    + '<div class="oseg" role="radiogroup" aria-labelledby="onH4">'
    + SCALES.map((k) => radio("scale", String(k), Math.round(k * 100) + "%", ' style="--k:' + k + '"')).join("") + '</div>'
    + '<p class="onote">' + onIcon("gear") + '<span>' + C.esc(T.note) + '</span></p></div>'
    + '<div class="oacts"><button id="onBack" type="button"><span>' + C.esc(T.back) + '</span></button>'
    + '<button id="onNext" type="button"><span></span></button></div>';
  syncOnboard(0);
  if (keep) (onboardEl.querySelector(keep) || $c("onNext")).focus();
}
// Shows the current step. dir: 1 forward, -1 back (the step animates in), 0 none.
function syncOnboard(dir) {
  const T = ONBOARD_TEXT[uiLang] || ONBOARD_TEXT.uk;
  onboardEl.querySelectorAll(".ostep").forEach((el, i) => {
    el.hidden = i !== onStep;
    el.classList.toggle("oin", i === onStep && dir !== 0);
    el.classList.toggle("oback", dir < 0);
  });
  onboardEl.querySelectorAll(".odot").forEach((el, i) => {
    el.classList.toggle("on", i === onStep);
    el.classList.toggle("past", i < onStep);
    if (i === onStep) el.setAttribute("aria-current", "step"); else el.removeAttribute("aria-current");
  });
  $c("onStepN").textContent = T.step.replace("{i}", onStep + 1).replace("{n}", ONBOARD_STEPS);
  $c("onBack").hidden = onStep === 0;
  $c("onNext").querySelector("span").textContent = onStep === ONBOARD_STEPS - 1 ? T.start : T.next;
  onRadios();
}
// The checked state, and one Tab stop per group (the checked card), like native radios.
function onRadios() {
  onboardEl.querySelectorAll("[data-scale]").forEach((b) => b.setAttribute("aria-checked", String(+b.dataset.scale === settings.scale)));
  onboardEl.querySelectorAll("[data-theme]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.theme === settings.theme)));
  onboardEl.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.lang === settings.lang)));
  onboardEl.querySelectorAll('[role="radiogroup"]').forEach((g) => {
    const all = [...g.querySelectorAll('[role="radio"]')];
    const on = all.find((b) => b.getAttribute("aria-checked") === "true") || all[0];
    all.forEach((b) => { b.tabIndex = b === on ? 0 : -1; });
  });
}
function onGo(d) {
  if (!onboardOn) return;
  const n = onStep + d;
  if (n < 0) return;
  if (n >= ONBOARD_STEPS) { if (finishOnboard()) cInput.focus(); return; }
  onStep = n;
  syncOnboard(d);
  onboardEl.scrollTop = 0;
  const a = document.activeElement;
  if (!a || !onboardEl.contains(a) || a.closest("[hidden]")) $c("onNext").focus();
}
function showOnboard(on) {
  if (!on || onboardOn || onboardShown) return;
  onboardShown = onboardOn = true;
  // A welcome that came first gives way. code.js marks the file on done.
  if (welcomeOn) { welcomeOn = false; welcomeEl.hidden = true; rootEl.classList.remove("welcome-open"); dockCompose(false); }
  openSettings(false);
  onStep = 0;
  renderOnboard();
  syncOnboard(1);
  onboardEl.hidden = false;
  rootEl.classList.add("onboard-open");
  $c("onNext").focus();
}
// Closes the screen and tells code.js once. The window stays in the chat.
function finishOnboard() {
  if (!onboardOn) return false;
  onboardOn = false;
  onboardEl.hidden = true;
  rootEl.classList.remove("onboard-open");
  parent.postMessage({ pluginMessage: { type: "onboarding-done" } }, "*");
  if (uiMode === "chat") { cMsgs._seen = false; cMsgs._html = ""; renderChat(); }
  return true;
}
// Bound once on the section: a language switch rebuilds what is inside.
onboardEl.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || !onboardOn) return;
  if (b.id === "onNext") onGo(1);
  else if (b.id === "onBack") onGo(-1);
  else if (b.id === "onSkip") { if (finishOnboard()) cInput.focus(); }
  else if (b.dataset.scale) saveSettings({ scale: +b.dataset.scale });
  else if (b.dataset.theme) saveSettings({ theme: b.dataset.theme });
  else if (b.dataset.lang) saveSettings({ lang: b.dataset.lang });
  onRadios();
});
onboardEl.addEventListener("keydown", (e) => {
  if (!onboardOn) return;
  // Enter would also click: act here and drop the click.
  if (e.key === "Enter" && e.target.id === "onNext") { e.preventDefault(); onGo(1); return; }
  // Arrow keys move inside a radio group and pick, like native radios.
  const r = e.target.closest && e.target.closest('[role="radio"]');
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!r || !step) return;
  e.preventDefault();
  const all = [...r.parentElement.querySelectorAll('[role="radio"]')];
  const nb = all[(all.indexOf(r) + step + all.length) % all.length];
  nb.click();
  // The click may rebuild the screen (language): focus the new button.
  (onboardEl.querySelector(nb.dataset.lang ? '[data-lang="' + nb.dataset.lang + '"]' : nb.dataset.theme ? '[data-theme="' + nb.dataset.theme + '"]' : '[data-scale="' + nb.dataset.scale + '"]') || nb).focus();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && onboardOn) { e.preventDefault(); if (finishOnboard()) cInput.focus(); }
});
renderOnboard();
LANG_HOOKS.push(renderOnboard);

connect();
</script>
</body>
